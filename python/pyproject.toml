[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "hecke-mass"
version = "0.1.0"
description = "Exact finite-table class mass, Hecke, and orbit arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
crystal = ["spglib>=2.7,<3"]
graphs = ["pynauty>=2.8.8.1,<3"]

[project.urls]
Repository = "https://github.com/brianredbeard/hecke-mass-kernel"

[tool.maturin]
module-name = "hecke_mass._core"
python-source = "src"
